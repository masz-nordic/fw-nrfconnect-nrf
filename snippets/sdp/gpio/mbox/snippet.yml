name: sdp-gpio-mbox

append:
  SB_EXTRA_CONF_FILE: ../sysbuild.conf

boards:
  /.*/cpuapp/:
    append:
      EXTRA_CONF_FILE: app.conf
  /.*/cpuflpr/:
    append:
      EXTRA_CONF_FILE: flpr.conf
  /.*/nrf54l15/cpuapp/:
    append:
      EXTRA_DTC_OVERLAY_FILE: soc/nrf54l15_cpuapp.overlay
  /.*/nrf54l15/cpuflpr/:
    append:
      EXTRA_DTC_OVERLAY_FILE: soc/nrf54l15_cpuflpr.overlay
